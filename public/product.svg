<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d3fa0"/>
      <stop offset="55%" stop-color="#6a3fb8"/>
      <stop offset="100%" stop-color="#9c4fc9"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#e2ddf5"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3f52"/>
      <stop offset="100%" stop-color="#20222e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  <circle cx="300" cy="230" r="260" fill="url(#glow)"/>

  <!-- soft ground shadow -->
  <ellipse cx="300" cy="500" rx="140" ry="22" fill="#000000" opacity="0.25"/>

  <g filter="url(#soft)">
    <!-- bottle body -->
    <rect x="220" y="230" width="160" height="250" rx="26" fill="url(#bottle)"/>
    <!-- neck -->
    <rect x="270" y="170" width="60" height="70" rx="10" fill="url(#bottle)"/>
    <!-- cap -->
    <rect x="258" y="120" width="84" height="60" rx="14" fill="url(#cap)"/>
    <!-- label -->
    <rect x="242" y="300" width="116" height="86" rx="8" fill="#ffffff" opacity="0.9"/>
    <rect x="258" y="322" width="84" height="8" rx="4" fill="#9c4fc9" opacity="0.7"/>
    <rect x="258" y="340" width="60" height="6" rx="3" fill="#c9c2e0"/>
    <rect x="258" y="354" width="70" height="6" rx="3" fill="#c9c2e0"/>
    <!-- highlight -->
    <rect x="232" y="245" width="18" height="220" rx="9" fill="#ffffff" opacity="0.55"/>
  </g>
</svg>
